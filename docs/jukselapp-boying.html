<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Bøyingstabell – substantiv 名词</title>
<style>
@page{size:A4 landscape;margin:0}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans","DejaVu Sans","Noto Sans CJK SC",sans-serif;color:#1f2937;background:#fffaf0}
.page{width:297mm;height:210mm;padding:5mm 6mm;overflow:hidden;display:grid;grid-template-rows:10mm 14mm 13mm 1fr;gap:2mm}
.top{display:flex;align-items:center;gap:4mm;border-bottom:2.5px solid #f97316}
.top h1{margin:0;font-size:17pt;color:#c2410c}.top .z{font-size:13pt;font-weight:800;color:#475569}.top .sp{flex:1}.top .n{font-size:8pt;color:#64748b;text-align:right;line-height:1.25}
.legend{display:grid;grid-template-columns:1.15fr repeat(4,1fr);gap:2mm}
.lg{overflow:hidden;border-radius:2mm;border-top:1.8mm solid var(--c);background:#fff;box-shadow:0 0 0 1.2px #e5e7eb;padding:.6mm 2mm;display:flex;align-items:center;gap:2mm;line-height:1.1}
.lg svg{flex:none}.lg .t b{color:var(--c);font-size:8.6pt;display:block}.lg .t span{font-size:7pt;color:#475569;display:block}.lg .t i{font-style:normal;font-weight:900;font-size:9pt;color:#111}
.lg.key{border-top-color:#94a3b8;font-size:7pt;color:#475569;display:block;padding:.8mm 2mm}.lg.key b{color:#111}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:4mm;min-height:0}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:8pt}
th{font-size:6.8pt;line-height:1.1;padding:.6mm .5mm;border-bottom:2px solid var(--c);color:var(--c);text-align:center;background:#fff}
th small{display:block;color:#475569;font-weight:600}
td{padding:0 1mm;height:var(--rh);line-height:1;border-bottom:.7px solid #e5e7eb;white-space:nowrap;overflow:hidden}
td.e{text-align:center;font-size:9pt;width:6mm;padding:0}td.z{color:#475569;font-size:7pt;width:15mm}
tr.grp td{background:var(--c);color:#fff;font-weight:900;font-size:8pt;border:0}
tr.grp td small{font-weight:600;opacity:.95;margin-left:2mm}
tr:nth-child(even):not(.grp) td{background:#fcfaf5}
.art{display:inline-block;color:#fff;border-radius:1mm;padding:0 1mm;font-weight:900;font-size:7.2pt;line-height:1.25;margin-right:.7mm}.en{background:#2563eb}.ei{background:#db2777}.et{background:#16a34a}
.w{font-weight:700}.ed{font-weight:900;border-bottom:.6mm solid currentColor}
.dd{display:inline-block;font-size:6.2pt;font-weight:800;color:var(--c);border:.5px solid var(--c);border-radius:1mm;padding:0 .7mm;margin-right:.7mm;line-height:1.2;vertical-align:.1mm;background:#fff}
.pt{display:grid;grid-template-columns:1.15fr repeat(4,1fr);gap:2mm;font-size:7pt;line-height:1.15}
.pt>div{overflow:hidden;background:#fff;border-radius:2mm;box-shadow:0 0 0 1.2px #e5e7eb;padding:.8mm 2mm;display:flex;flex-direction:column;justify-content:center}
.pt .h{background:#f1f5f9}.pt b{font-size:8pt}.pt .x{font-weight:800;color:#111;font-size:7pt;white-space:nowrap}.pt small{color:#475569;font-size:6.4pt}
.c-ue{--c:#f97316}.c-be{--c:#0d9488}.c-uf{--c:#9333ea}.c-bf{--c:#a16207}
</style>
</head>
<body>
<div class="page">
 <div class="top"><h1>📊 Bøyingstabell</h1><span class="z">名词变形表</span><span class="sp"></span>
  <span class="n">Lær ordet <b>sammen med en / ei / et</b> · 单词要和 en/ei/et 一起记<br>Understreket = endelsen · 画线的部分是词尾</span></div>
 <div class="legend" id="legend"></div>
 <div class="pt" id="pt"></div>
 <div class="cols"><table id="t1"></table><table id="t2"></table></div>
</div>
<script src="../js/util.js"></script>
<script src="../js/data.js"></script>
<script src="../js/graphics.js"></script>
<script>
(function(){
  const A = window.App;
  // flere vanlige ord (bare til denne tabellen)
  const X = [
    ['en','far','faren','fedre','fedrene','爸爸','👨'],['ei','mor','mora','mødre','mødrene','妈妈','👩'],
    ['en','bror','broren','brødre','brødrene','兄弟','🧑'],['ei','søster','søstera','søstre','søstrene','姐妹','👧'],
    ['et','år','året','år','årene','年','🗓️'],['et','ord','ordet','ord','ordene','单词','💬'],
    ['en','time','timen','timer','timene','小时','⏰'],['et','navn','navnet','navn','navnene','名字','🏷️']
  ].map(r => ({art:r[0], no:r[1], be:r[2], uf:r[3], bf:r[4], zh:r[5], emoji:r[6]}));
  const words = A.WORDS.map(w => ({art:w.art, no:w.no, be:w.be, uf:w.uf, bf:w.bf, zh:w.zh, emoji:w.emoji})).concat(X);
  const GROUPS = [['en', 'en-ord', '阳性 hankjønn', '#2563eb'], ['ei', 'ei-ord', '阴性 hunkjønn', '#db2777'], ['et', 'et-ord', '中性 intetkjønn', '#16a34a']];
  const sorter = (a, b) => a.no.localeCompare(b.no, 'nb');
  const end = (base, form, key) => { const [s, e] = A.endSplit(base, form); const c = A.formMeta(key).color; return `<span class="w">${s}</span><span class="ed" style="color:${c}">${e}</span>`; };
  const ueCell = w => `<span class="art ${w.art}">${w.art}</span><span class="w">${w.no}</span>`;

  // lag flat liste med gruppeoverskrifter, del i to kolonner
  const flat = [];
  GROUPS.forEach(g => { flat.push({h:g}); words.filter(w => w.art === g[0]).sort(sorter).forEach(w => flat.push({w})); });
  const half = Math.ceil(flat.length / 2);
  let a = flat.slice(0, half), b = flat.slice(half);
  // unngå at en overskrift står alene nederst / mangler øverst
  if(a.length && a[a.length - 1].h) b.unshift(a.pop());
  if(b.length && !b[0].h){ let g = null; for(let i = flat.indexOf(b[0]) - 1; i >= 0; i--) if(flat[i].h){ g = flat[i].h; break; } b.unshift({h:g, cont:true}); }

  const head = `<tr><th style="--c:#475569;width:6mm"></th>${A.FORMS.map(f => `<th style="--c:${f.color}">${f.no}<small>${f.zh}</small></th>`).join('')}<th style="--c:#475569;width:15mm">中文</th></tr>`;
  const rows = list => list.map(r => r.h ? `<tr class="grp" style="--c:${r.h[3]}"><td colspan="6">${r.h[1]}${r.cont ? ' (forts.)' : ''}<small>${r.h[2]}</small></td></tr>`
    : `<tr><td class="e">${r.w.emoji}</td><td>${ueCell(r.w)}</td><td>${end(r.w.no, r.w.be, 'be')}<span class="dd" style="--c:#0d9488;margin:0 0 0 1.2mm">${r.w.art === 'et' ? 'det' : 'den'}</span></td><td>${end(r.w.no, r.w.uf, 'uf')}</td><td>${end(r.w.no, r.w.bf, 'bf')}<span class="dd" style="--c:#a16207;margin:0 0 0 1.2mm">de</span></td><td class="z">${r.w.zh}</td></tr>`).join('');
  document.getElementById('t1').innerHTML = head + rows(a);
  document.getElementById('t2').innerHTML = head + rows(b);
  // krymp radhøyden til begge kolonnene får plass
  const colsEl = document.querySelector('.cols');
  let rh = 5.2; document.documentElement.style.setProperty('--rh', rh + 'mm');
  const fits = () => Math.max(document.getElementById('t1').offsetHeight, document.getElementById('t2').offsetHeight) <= colsEl.clientHeight;
  while(!fits() && rh > 2.4){ rh -= 0.05; document.documentElement.style.setProperty('--rh', rh.toFixed(2) + 'mm'); }

  document.getElementById('pt').innerHTML =
    `<div class="h" style="gap:.3mm"><span style="font-size:7.4pt"><b style="font-size:7.6pt">den · det · de</b> = 那个 · 那些</span><span style="font-size:7.4pt"><b style="font-size:7.6pt">denne · dette · disse</b> = 这个 · 这些</span><small>+ bestemt form · 后面接定指形式</small></div>` +
    [['en', 'en hund', ['den', 'denne'], 'hunden', 'store hunden', '#2563eb'], ['ei', 'ei jente', ['den', 'denne'], 'jenta', 'store jenta', '#db2777'],
     ['et', 'et hus', ['det', 'dette'], 'huset', 'store huset', '#16a34a'], ['', 'hunder (alle 所有)', ['de', 'disse'], 'hundene', 'store hundene', '#a16207']]
    .map(r => `<div style="border-left:1.6mm solid ${r[5]}"><span class="x">${r[1]}</span>
      <span class="x" style="color:${r[5]};font-size:6.2pt">→ ${r[2][0]} ${r[3]} · ${r[2][0]} ${r[4]}</span>
      <span class="x" style="color:${r[5]};font-size:6.2pt">→ ${r[2][1]} ${r[3]} · ${r[2][1]} ${r[4]}</span></div>`).join('');
  const ex = A.WORDS.find(w => w.no === 'hund');
  document.getElementById('legend').innerHTML = `<div class="lg key"><b>Slik leser du tabellen · 怎么看这张表</b><br>Eksempel: <b>hund</b> 🐶 = 狗. Hver kolonne er én form. / 每一列是一种形式。</div>` +
    A.FORMS.map(f => `<div class="lg c-${f.key}" style="--c:${f.color}">${A.formIcon(f.key, 34)}<div class="t"><b>${f.no}</b><span>${f.zh} · ${f.tagNo} / ${f.tagZh}</span><i>${f.key === 'ue' ? 'en hund' : ex[f.key]}</i></div></div>`).join('');
})();
</script>
</body>
</html>
